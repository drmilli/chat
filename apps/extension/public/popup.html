<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chorus</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f0f0f0;
        --panel: rgba(255, 255, 255, 0.6);
        --panel-strong: rgba(255, 255, 255, 0.82);
        --border: rgba(255, 255, 255, 0.6);
        --border-ink: rgba(30, 50, 90, 0.1);
        --text: rgba(30, 50, 90, 0.95);
        --muted: rgba(30, 50, 90, 0.55);
        --accent: rgba(30, 50, 90, 0.8);
        --accent-solid: rgb(30, 50, 90);
        --success: #0f9d6b;
        --danger: #d1415f;
      }

      * {
        box-sizing: border-box;
      }

      /* An author `display` beats the UA's `[hidden] { display: none }`, so
         .row/.card elements toggled via el.hidden stayed visible. */
      [hidden] {
        display: none !important;
      }

      /* Chrome sizes the popup from the document, not from <body>. Leaving
         <html> unconstrained let it stretch to the 800px popup maximum and
         paint the leftover area with the page background. */
      html {
        width: 360px;
        min-width: 360px;
        max-width: 360px;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        width: 360px;
        max-width: 360px;
        overflow-x: hidden;
        font-family: 'Helvetica Regular', Inter, system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      .wrap {
        display: grid;
        gap: 14px;
        padding: 16px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        display: block;
      }

      .brand-title {
        font-size: 0.95rem;
        font-weight: 500;
        line-height: 1.1;
      }

      .brand-sub {
        font-size: 0.66rem;
        color: var(--muted);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.7rem;
        color: var(--muted);
        border: 1px solid var(--border);
        background: var(--panel-strong);
        border-radius: 999px;
        padding: 5px 10px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }

      .dot.online { background: var(--success); }
      .dot.offline { background: var(--danger); }

      .card {
        border: 1px solid var(--border);
        background: var(--panel);
        backdrop-filter: blur(18px);
        border-radius: 20px;
        padding: 13px;
        display: grid;
        gap: 10px;
      }

      .label {
        margin: 0;
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .ca {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.86rem;
        word-break: break-all;
        color: var(--text);
      }

      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      button {
        font: inherit;
        font-size: 0.82rem;
        font-weight: 400;
        cursor: pointer;
        border-radius: 11px;
        padding: 9px 12px;
        border: 1px solid var(--border-ink);
        background: #fff;
        color: var(--text);
        transition: filter 0.15s ease, opacity 0.15s ease;
      }

      /* Must exclude .primary: button:hover outranks button.primary, so a
         shared hover background turned primary buttons white-on-white. */
      button:hover:not(:disabled):not(.primary) { background: rgba(255, 255, 255, 0.7); }
      button.primary:hover:not(:disabled) { background: var(--accent-solid); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }

      button.primary {
        border: none;
        background: var(--accent);
        color: #fff;
        font-weight: 400;
      }

      button.link {
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 4px 0;
        font-size: 0.72rem;
        font-weight: 500;
      }

      button.link:hover { color: var(--text); }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
      }

      .stat {
        border: 1px solid var(--border);
        background: var(--panel-strong);
        border-radius: 16px;
        padding: 9px 7px;
        text-align: center;
      }

      .stat-value {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 500;
        color: var(--text);
      }

      .stat-label {
        margin: 3px 0 0;
        font-size: 0.6rem;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 11px;
        border: 1px solid var(--border-ink);
        background: #fff;
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
      }

      input:focus {
        outline: none;
        border-color: rgba(30, 50, 90, 0.35);
      }

      .hint {
        margin: 0;
        font-size: 0.7rem;
        color: var(--muted);
      }

      .hint.error { color: var(--danger); }

      .list {
        display: grid;
        gap: 6px;
        max-height: 168px;
        overflow-y: auto;
      }

      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        text-align: left;
        padding: 9px 10px;
        border-radius: 11px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.55);
        font-weight: 400;
      }

      .item-ca {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.78rem;
        color: var(--text);
      }

      .item-meta {
        font-size: 0.65rem;
        color: var(--muted);
        white-space: nowrap;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .empty {
        margin: 0;
        font-size: 0.74rem;
        color: var(--muted);
        line-height: 1.5;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <img class="brand-mark" src="logo.svg" alt="Chorus" />
          <div>
            <div class="brand-title">Chorus</div>
            <div class="brand-sub">Contract rooms</div>
          </div>
        </div>
        <div class="status">
          <span class="dot" id="backend-dot"></span>
          <span id="backend-status">checking…</span>
        </div>
      </header>

      <section class="card" id="detected-card">
        <div class="section-head">
          <p class="label">This page</p>
          <span class="item-meta" id="detected-site"></span>
        </div>
        <p class="ca" id="detected-ca">Scanning for a token…</p>
        <p class="hint" id="detected-meta"></p>
        <div class="row" id="detected-actions" hidden>
          <button class="primary" id="open-detected">Open chat room</button>
          <button id="show-widget">Show widget</button>
          <button id="copy-detected">Copy</button>
        </div>
      </section>

      <section class="stats">
        <div class="stat"><p class="stat-value" id="stat-rooms">—</p><p class="stat-label">Rooms</p></div>
        <div class="stat"><p class="stat-value" id="stat-active">—</p><p class="stat-label">Live 24h</p></div>
        <div class="stat"><p class="stat-value" id="stat-users">—</p><p class="stat-label">Users</p></div>
        <div class="stat"><p class="stat-value" id="stat-messages">—</p><p class="stat-label">Msgs</p></div>
      </section>

      <section class="card">
        <p class="label">Open by contract address</p>
        <input id="ca-input" placeholder="0x… or Solana address" spellcheck="false" autocomplete="off" />
        <p class="hint" id="ca-hint">Paste a CA to jump straight into its room.</p>
        <div class="row">
          <button class="primary" id="open-ca">Open chat room</button>
          <button id="connect-wallet">Connect wallet</button>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <p class="label">Detected addresses</p>
          <button class="link" id="clear-history">Clear</button>
        </div>
        <div class="list" id="history-list"></div>
      </section>

      <footer>
        <button class="link" id="open-web">Open web app ↗</button>
        <button class="link" id="open-rooms">Browse active rooms ↗</button>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
